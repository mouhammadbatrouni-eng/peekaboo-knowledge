<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peekaboo — Training</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --bg:#fffaf5; --panel:#fff3e7; --card:#fffdfb; --border:#f0dcc6; --text:#2f2a26;
    --muted:#857a6f; --accent:#d2691e; --accent-soft:#fdeadb; --code:#f7efe7; --shadow:0 2px 10px rgba(120,80,40,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16141b; --panel:#1e1b24; --card:#221f2a; --border:#332e3c; --text:#ece8e4;
      --muted:#9e948b; --accent:#fb923c; --accent-soft:#3a2518; --code:#272231; --shadow:0 2px 10px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;height:100vh;overflow:hidden}
  nav{width:290px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
    overflow-y:auto;padding:20px 0 60px}
  .brand{padding:0 20px 14px;border-bottom:1px solid var(--border);margin-bottom:14px}
  .brand b{display:block;font-size:17px}
  .brand span{font-size:12.5px;color:var(--muted)}
  nav a{display:block;padding:9px 20px;color:var(--text);text-decoration:none;font-size:14.5px;
    border-left:3px solid transparent}
  nav a:hover{background:var(--accent-soft)}
  nav a.active{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
  .searchbox{padding:0 16px 14px}
  .searchbox input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;
    background:var(--card);color:var(--text);font-size:14px}
  .searchbox input:focus{outline:2px solid var(--accent);outline-offset:1px}
  main{flex:1;overflow-y:auto;padding:40px 56px 120px}
  article{max-width:820px}
  h1{font-size:31px;line-height:1.25;margin:0 0 20px}
  h2{font-size:22px;margin:40px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--border)}
  h3{font-size:18px;margin:30px 0 9px}
  h4{font-size:15.5px;margin:22px 0 7px;color:var(--accent)}
  table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14.5px;display:block;overflow-x:auto}
  th,td{border:1px solid var(--border);padding:8px 11px;text-align:left;vertical-align:top}
  th{background:var(--panel);font-weight:600}
  code{background:var(--code);padding:2px 5px;border-radius:4px;font-size:13.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  pre{background:var(--code);padding:14px 16px;border-radius:9px;overflow-x:auto}
  pre code{background:none;padding:0}
  blockquote{margin:16px 0;padding:2px 18px;border-left:3px solid var(--accent);
    background:var(--accent-soft)}
  hr{border:0;border-top:1px solid var(--border);margin:32px 0}
  a{color:var(--accent)}
  ol li,ul li{margin:5px 0}
  .roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;margin:26px 0 8px}
  .role{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:17px;
    cursor:pointer;box-shadow:var(--shadow);transition:transform .12s, border-color .12s}
  .role:hover{transform:translateY(-2px);border-color:var(--accent)}
  .role b{display:block;font-size:16px;margin-bottom:5px}
  .role span{font-size:13.5px;color:var(--muted);line-height:1.5}
  .hero{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:26px 28px;
    box-shadow:var(--shadow);margin-bottom:10px}
  .hero h1{margin:0 0 8px}
  .hero p{margin:0;color:var(--muted);font-size:15.5px}
  .res{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 16px;
    margin:10px 0;cursor:pointer}
  .res:hover{border-color:var(--accent)}
  .res b{color:var(--accent);font-size:14.5px}
  .res p{margin:5px 0 0;font-size:14px;color:var(--muted)}
  .res .where{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  mark{background:var(--accent-soft);color:var(--text);font-weight:600;padding:0 2px;border-radius:3px}
  .loading{color:var(--muted);font-style:italic}
  @media (max-width:820px){
    nav{width:210px} main{padding:26px 22px 90px}
  }
</style>
</head>
<body>
<nav>
  <div class="brand"><b>Peekaboo</b><span>Training for nursery teams</span></div>
  <div class="searchbox"><input id="q" type="search" placeholder="Search training…" autocomplete="off"></div>
  <div id="navlinks"></div>
</nav>
<main><article id="content"><p class="loading">Loading…</p></article></main>

<script>
const DOCS = [
  ["home",                        "Start here"],
  ["01-welcome.md",               "Welcome to Peekaboo"],
  ["02-role-tracks.md",           "Training by role"],
  ["03-how-to.md",                "How to — everyday tasks"],
  ["06-module-guides.md",         "Guide to each area"],
  ["04-faq.md",                   "Frequently asked questions"],
  ["05-getting-unstuck.md",       "Getting unstuck"],
  ["07-glossary-and-statuses.md", "Words and statuses"],
  ["08-all-links.md",             "Every page, one click"],
];

const ROLES = [
  ["Principal",  "You run the nursery and see every part of the portal."],
  ["Registrar",  "Front desk and admissions — enquiries, tours, enrolling children."],
  ["Teacher",    "Your room — attendance, daily reports, observations."],
  ["Assistant",  "Supporting the room — attendance and daily reports."],
  ["Accountant", "The books — invoices, receipts, expenses, balances."],
  ["Admin",      "You decide what everyone else is allowed to see."],
  ["Guest",      "A limited, mostly read-only view."],
];

const navlinks = document.getElementById("navlinks");
const content = document.getElementById("content");
const q = document.getElementById("q");
const cache = {};

for (const [file, title] of DOCS) {
  const a = document.createElement("a");
  a.href = "#" + file; a.dataset.file = file; a.textContent = title;
  navlinks.appendChild(a);
}

function setActive(file) {
  document.querySelectorAll("nav a").forEach(a =>
    a.classList.toggle("active", a.dataset.file === file));
}

async function fetchDoc(file) {
  if (cache[file]) return cache[file];
  const res = await fetch(file);
  if (!res.ok) throw new Error(res.status);
  return (cache[file] = await res.text());
}

function renderHome() {
  setActive("home");
  content.innerHTML = `
    <div class="hero">
      <h1>Welcome to Peekaboo training</h1>
      <p>Everything you need to run your nursery in the portal — start with your role, or browse by topic.</p>
    </div>
    <h2>Start with your role</h2>
    <div class="roles">${ROLES.map(([n, d]) =>
      `<div class="role" data-role="${n}"><b>${n}</b><span>${d}</span></div>`).join("")}</div>
    <h2>Or jump straight in</h2>
    <ul>
      <li><a href="#01-welcome.md">Welcome</a> — what Peekaboo is, signing in, finding your way around.</li>
      <li><a href="#03-how-to.md">How to</a> — step-by-step instructions for everyday tasks.</li>
      <li><a href="#06-module-guides.md">Guide to each area</a> — what every part of the portal is for.</li>
      <li><a href="#04-faq.md">FAQ</a> — quick answers to common questions.</li>
      <li><a href="#05-getting-unstuck.md">Getting unstuck</a> — when something doesn't look right.</li>
      <li><a href="#07-glossary-and-statuses.md">Words and statuses</a> — what the terms on screen mean.</li>
    </ul>
    <p style="color:var(--muted);font-size:14px;margin-top:26px">
      Tip: use the search box to find anything across the whole training.</p>`;
  content.querySelectorAll(".role").forEach(el => el.onclick = () => {
    location.hash = "02-role-tracks.md";
    setTimeout(() => {
      const want = el.dataset.role.toLowerCase();
      const h = [...content.querySelectorAll("h2,h3")]
        .find(x => x.textContent.toLowerCase().includes(want));
      if (h) h.scrollIntoView({behavior:"smooth", block:"start"});
    }, 450);
  });
}

async function renderDoc(file) {
  setActive(file);
  content.innerHTML = '<p class="loading">Loading…</p>';
  try {
    content.innerHTML = marked.parse(await fetchDoc(file));
    // Portal links must open in a new tab — otherwise clicking one navigates the
    // reader away from the training they were halfway through.
    content.querySelectorAll('a[href^="http"]').forEach(a => {
      a.target = "_blank";
      a.rel = "noopener";
    });
    document.querySelector("main").scrollTop = 0;
  } catch (e) {
    content.innerHTML = "<h1>Could not load</h1><p>" + file + "</p>";
  }
}

// Strip markdown syntax so search snippets read as prose, not source.
function clean(s) {
  // Resolve balanced pairs FIRST — stripping bullets first would eat the opening
  // ** of a line-leading bold run and leave its closing ** stranded.
  return s
    .replace(/\*\*([^*]+)\*\*/g, "$1")       // bold
    .replace(/`([^`]+)`/g, "$1")             // inline code
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1") // links
    .replace(/^[\s>]*[-+]?\s*\d*\.?\s*/, "") // bullets / numbering / quotes (not *)
    .replace(/[*_]+/g, "")                   // any stray emphasis left over
    .replace(/[|]/g, " ")                    // table pipes
    .replace(/\s+/g, " ")
    .trim();
}

async function search(term) {
  setActive(null);
  const t = term.toLowerCase();
  content.innerHTML = '<h1>Searching…</h1>';
  const out = [];
  for (const [file, title] of DOCS) {
    if (file === "home") continue;
    let text;
    try { text = await fetchDoc(file); } catch { continue; }
    const lines = text.split("\n");
    let heading = title;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (/^#{1,4}\s/.test(line)) heading = clean(line.replace(/^#+\s*/, "")).replace(/["]/g, "");
      if (line.toLowerCase().includes(t) && line.trim() && !/^#{1,4}\s/.test(line)) {
        out.push({ file, title, heading, line: clean(line) });
        if (out.length > 60) break;
      }
    }
    if (out.length > 60) break;
  }
  const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
  const hl = s => esc(s).replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "ig"), "<mark>$1</mark>");
  content.innerHTML = `<h1>Search: “${esc(term)}”</h1>
    <p style="color:var(--muted)">${out.length ? out.length + " result" + (out.length===1?"":"s") : "Nothing found. Try a different word."}</p>`
    + out.map((r,i) => `<div class="res" data-i="${i}">
        <div class="where">${esc(r.title)}</div>
        <b>${hl(r.heading)}</b>
        <p>${hl(r.line.slice(0,240))}${r.line.length>240?"…":""}</p></div>`).join("");
  content.querySelectorAll(".res").forEach(el => el.onclick = () => {
    const r = out[+el.dataset.i];
    location.hash = r.file;
    setTimeout(() => {
      const h = [...content.querySelectorAll("h1,h2,h3,h4")]
        .find(x => x.textContent.replace(/["]/g,"").includes(r.heading.slice(0,40)));
      if (h) h.scrollIntoView({behavior:"smooth", block:"start"});
    }, 450);
  });
}

let timer;
q.addEventListener("input", () => {
  clearTimeout(timer);
  const v = q.value.trim();
  timer = setTimeout(() => {
    if (v.length >= 2) search(v);
    else route();
  }, 280);
});

function route() {
  const f = location.hash ? location.hash.slice(1) : "home";
  if (f === "home") renderHome(); else renderDoc(f);
}
window.addEventListener("hashchange", () => { q.value = ""; route(); });
route();
</script>
</body>
</html>
